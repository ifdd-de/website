# nginx configuration of ifdd.de.
#
# Plain HTTP on port 8080 (unprivileged image). TLS ends at an endpoint in
# front of this container, which forwards ifdd.de, www.ifdd.de and
# example.ifdd.de here with the original Host header. The two redirects are
# done here, so the endpoint needs no rules of its own.
#
# Changes here need `docker compose restart`; changes below site/ or legal/
# do not.

# www.ifdd.de -> ifdd.de, keeping path and query.
server {
    listen 8080;
    server_name www.ifdd.de;
    server_tokens off;
    return 301 https://ifdd.de$request_uri;
}

# example.ifdd.de -> the page that explains the example namespace. 302, not
# 301: browsers keep a 301 forever, and the target may still change.
server {
    listen 8080;
    server_name example.ifdd.de;
    server_tokens off;
    return 302 https://ifdd.de/example/;
}

# ifdd.de, and every other Host header (also the container health check).
server {
    # IPv4 only on purpose: an IPv6 listen socket fails to bind in
    # containers without IPv6.
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    charset utf-8;
    # Redirects such as /example -> /example/ keep a relative Location, so
    # they do not point to http:// or to port 8080 behind the TLS endpoint.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css image/svg+xml;

    error_page 404 /404.html;

    # Container health check (see compose.yml).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never serve hidden files or directories.
    location ~ /\. {
        return 404;
    }

    # Legal pages: from legal/ (not in the repository), see README.md.
    location = /impressum/ {
        root /usr/share/nginx/legal;
        try_files /impressum.html =404;
    }
    location = /datenschutz/ {
        root /usr/share/nginx/legal;
        try_files /datenschutz.html =404;
    }
    location = /impressum {
        return 301 /impressum/;
    }
    location = /datenschutz {
        return 301 /datenschutz/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }
}
