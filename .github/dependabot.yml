# Dependabot version updates for website: the actions of its workflow
# (pinned to commit SHAs with the version as comment) and the nginx image
# in compose.yml.
# Security updates are a repository setting and do not depend on this file.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
