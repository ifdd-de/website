# ifdd.de: static website served by the upstream unprivileged nginx image.
# The container listens on a local port only; a TLS endpoint in front of it
# forwards ifdd.de, www.ifdd.de and example.ifdd.de (see README.md).
services:
  website:
    image: "nginxinc/nginx-unprivileged:1.30.5-alpine-slim"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "${IFDD_WEBSITE_BIND:-127.0.0.1}:${IFDD_WEBSITE_PORT:-8080}:8080"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Legal pages, not in the repository. Compose stops with an error if
      # legal/ is missing instead of creating an empty directory as root.
      - type: bind
        source: ./legal
        target: /usr/share/nginx/legal
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M
    restart: always
