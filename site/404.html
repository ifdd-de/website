<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | IFDD</title>
  <meta name="robots" content="noindex">
  <!-- Served for any missing path, so all links are absolute to the site root. -->
  <link rel="icon" href="/assets/ifdd-favicon.ico" sizes="any">
  <link rel="icon" href="/assets/ifdd-favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">
        <picture>
          <source srcset="/assets/ifdd-monogram-dark.svg" media="(prefers-color-scheme: dark)">
          <img src="/assets/ifdd-monogram-light.svg" alt="IFDD logo" width="40" height="40">
        </picture>
        <span>ifdd.de</span>
      </a>
    </div>
  </header>
  <main class="wrap">
    <h1>Page not found</h1>
    <p>There is no page at this address. Names under <code>example.ifdd.de</code>
    are examples &mdash; see <a href="/example/">the example namespace</a>.</p>
    <p><a href="/">Home</a></p>

    <div lang="de">
      <h2>Seite nicht gefunden</h2>
      <p>Unter dieser Adresse gibt es keine Seite. Namen unter
      <code>example.ifdd.de</code> sind Beispiele &mdash; siehe
      <a href="/de/example/">den Beispiel-Namensraum</a>.</p>
      <p><a href="/de/">Startseite</a></p>
    </div>
  </main>
</body>
</html>
